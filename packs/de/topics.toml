# =============================================================== notes
#
# B2, C1 and C2 are empty. The source curriculum stops at B1. Missing for the
# higher levels: Genitiv, Relativsätze, Passiv, Konjunktiv II past, Futur I and
# II, Präteritum of regular and irregular verbs in general, indirect speech,
# Partizipialkonstruktionen, Nominalstil.
#
# Where the stage order differs from the source order and why:
#
# 1. sein and haben come before the past tenses, since Perfekt is built from
#    them. That is already true across levels here.
# 2. Adjective endings after definite articles come before endings after
#    indefinite articles. The source has it the other way round, but the weak
#    declension after der/die/das has only two endings to learn, so it is the
#    easier entry point.
# 3. cases.dative_adjective_endings is labelled B1 in the source while the other
#    two adjective ending topics are A2. It really belongs immediately after
#    them. The cefr label is kept as given, but the topic should be scheduled
#    right after adjectives.after_indefinite.
# 4. connectors.coordinating is labelled B1 but is closer to A2 in difficulty,
#    and it directly extends connectors.und_aber from A1.
