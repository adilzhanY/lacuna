# cefr    = level, from A1 to Muttersprache, as on the ROADMAP:deutsch poster.
#           Busuu topics keep the CEFR label of the source curriculum.
# stage   = suggested teaching order inside that level, which is not always the
#           same as the source order (see the notes at the bottom)
# status  = "new" when the topic has never been studied yet

